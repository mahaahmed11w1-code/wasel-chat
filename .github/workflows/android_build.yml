name: Android Build and SHA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Print Android Signing SHA Fingerprints
        run: |
          cd android
          ./gradlew signingReport --no-daemon | grep -E "Variant:|Config:|Store:|Alias:|MD5:|SHA1:|SHA-256:" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release
