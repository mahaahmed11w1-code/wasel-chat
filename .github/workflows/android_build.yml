name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform files exist
        run: flutter create --platforms=android --project-name wasel_chat .

      - name: Update Android SDK and MultiDex
        run: |
          python3 -c '
          import glob, re
          for path in glob.glob("android/app/build.gradle*"):
              s = open(path, encoding="utf-8").read()
              s = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdk = 23", s)
              s = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", s)
              s = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdk = 35", s)
              s = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 35", s)
              s = re.sub(r"targetSdk\s*=?\s*flutter\.targetSdkVersion", "targetSdk = 35", s)
              s = re.sub(r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 35", s)
              if "multiDexEnabled" not in s:
                  s = re.sub(r"(versionCode\s*[^\n]+)", r"\1\n        multiDexEnabled = true", s, count=1)
              open(path, "w", encoding="utf-8").write(s)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasel-android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
