name: Android Build and SHA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Ensure complete Android v2 project files
        run: |
          mkdir -p /tmp/wasel_backup
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/wasel_backup/google-services.json
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/wasel_backup/AndroidManifest.xml
          fi
          if [ -f android/app/src/main/kotlin/com/example/wasel_chat/MainActivity.kt ]; then
            cp android/app/src/main/kotlin/com/example/wasel_chat/MainActivity.kt /tmp/wasel_backup/MainActivity.kt
          fi

          rm -rf android
          flutter create --platforms=android --org com.example --project-name wasel_chat .

          if [ -f /tmp/wasel_backup/google-services.json ]; then
            cp /tmp/wasel_backup/google-services.json android/app/google-services.json
          fi
          if [ -f /tmp/wasel_backup/AndroidManifest.xml ]; then
            cp /tmp/wasel_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f /tmp/wasel_backup/MainActivity.kt ]; then
            mkdir -p android/app/src/main/kotlin/com/example/wasel_chat
            cp /tmp/wasel_backup/MainActivity.kt android/app/src/main/kotlin/com/example/wasel_chat/MainActivity.kt
          fi

      - name: Print Android Signing SHA Fingerprints
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasel-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
